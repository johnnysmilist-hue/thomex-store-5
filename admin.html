<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thomex Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="bg-[#f0f0f1]">

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="flex items-center justify-center gap-2 mb-6">
      <div class="w-9 h-9 rounded brand-grad flex items-center justify-center"><i data-lucide="zap" class="w-5 h-5 text-white"></i></div>
      <span class="text-2xl font-extrabold font-display">Thomex Admin</span>
    </div>
    <div class="bg-white border border-neutral-200 rounded p-6 shadow-sm">
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="text-xs font-semibold text-neutral-600">Username or Email</label>
          <input required id="loginUser" type="text" class="w-full mt-1 border border-neutral-300 rounded px-3 py-2 text-sm outline-none focus:border-[var(--violet)]" placeholder="admin"/>
        </div>
        <div>
          <label class="text-xs font-semibold text-neutral-600">Password</label>
          <input required id="loginPass" type="password" class="w-full mt-1 border border-neutral-300 rounded px-3 py-2 text-sm outline-none focus:border-[var(--violet)]" placeholder="••••••••"/>
        </div>
        <button type="submit" class="w-full bg-[var(--violet)] hover:bg-[var(--violet-dark)] transition text-white font-semibold py-2.5 rounded text-sm">Log In</button>
        <p id="loginError" class="hidden text-xs text-red-600 text-center">Incorrect username or password.</p>
      </form>
    </div>
    <p class="text-center text-xs text-neutral-500 mt-4">Demo credentials: <span class="font-mono font-semibold">admin</span> / <span class="font-mono font-semibold">admin123</span></p>
    <p class="text-center text-xs mt-2"><a href="index.html" class="text-[var(--violet)] hover:underline">&larr; Back to store</a></p>
  </div>
</div>

<!-- ADMIN SHELL -->
<div id="adminShell" class="hidden">

  <!-- Top admin bar -->
  <div class="h-8 bg-[#1d2327] text-neutral-200 flex items-center justify-between px-3 text-xs fixed top-0 inset-x-0 z-50">
    <div class="flex items-center gap-4">
      <a href="index.html" class="flex items-center gap-1 hover:text-white"><i data-lucide="home" class="w-3.5 h-3.5"></i> Visit Store</a>
    </div>
    <div class="flex items-center gap-3">
      <span>Howdy, <strong id="adminGreetName">Admin</strong></span>
      <div class="w-5 h-5 rounded-full bg-[var(--violet)] flex items-center justify-center text-white font-bold text-[10px]" id="adminAvatar">A</div>
    </div>
  </div>

  <!-- Sidebar -->
  <aside id="adminSidebar" class="fixed top-8 bottom-0 left-0 w-56 bg-[#1d2327] text-neutral-300 overflow-y-auto z-40">
    <div class="px-4 py-4 flex items-center gap-2 border-b border-white/10">
      <div class="w-7 h-7 rounded brand-grad flex items-center justify-center"><i data-lucide="zap" class="w-4 h-4 text-white"></i></div>
      <span class="text-white font-bold font-display text-sm">Thomex</span>
    </div>
    <nav class="py-2 text-sm">
      <button data-admin-page="dashboard" class="admin-nav-item w-full flex items-center gap-3 px-4 py-2.5 hover:bg-white/5 hover:text-white text-left">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
      </button>
      <button data-admin-page="products" class="admin-nav-item w-full flex items-center gap-3 px-4 py-2.5 hover:bg-white/5 hover:text-white text-left">
        <i data-lucide="package" class="w-4 h-4"></i> Products
      </button>
      <button data-admin-page="orders" class="admin-nav-item w-full flex items-center gap-3 px-4 py-2.5 hover:bg-white/5 hover:text-white text-left">
        <i data-lucide="shopping-bag" class="w-4 h-4"></i> Orders
      </button>
      <button data-admin-page="settings" class="admin-nav-item w-full flex items-center gap-3 px-4 py-2.5 hover:bg-white/5 hover:text-white text-left">
        <i data-lucide="settings" class="w-4 h-4"></i> Settings
      </button>
      <div class="border-t border-white/10 mt-2 pt-2">
        <button id="adminLogoutBtn" class="w-full flex items-center gap-3 px-4 py-2.5 hover:bg-white/5 hover:text-white text-left">
          <i data-lucide="log-out" class="w-4 h-4"></i> Log Out
        </button>
      </div>
    </nav>
  </aside>

  <!-- Main content -->
  <main class="ml-56 mt-8 p-6 min-h-[calc(100vh-2rem)]">
    <div id="adminPageBody"></div>
  </main>

</div>

<!-- PRODUCT FORM MODAL -->
<div id="productFormOverlay" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4">
  <div class="bg-white rounded max-w-lg w-full max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between px-5 py-4 border-b border-neutral-200">
      <h3 id="productFormTitle" class="font-bold text-lg">Add New Product</h3>
      <button id="closeProductForm" class="w-8 h-8 rounded-full hover:bg-neutral-100 flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div id="productFormBody" class="p-5"></div>
  </div>
</div>

<!-- TOAST -->
<div id="adminToast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#1d2327] text-white text-sm font-medium px-5 py-3 rounded-full shadow-xl z-[70] items-center gap-2">
  <i data-lucide="check-circle" class="w-4 h-4 text-green-400"></i><span id="adminToastText">Saved</span>
</div>

<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
